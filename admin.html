<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Ezra Wanyama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 30px 16px; }
        .admin-card { width: 100%; max-width: 520px; background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h2 { font-size: 1.3rem; font-weight: 700; color: #38bdf8; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 14px; background: #090d16; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; }
        .input-group input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; margin-top: 6px; }
        .btn-purple { background: linear-gradient(135deg, #9333ea, #c084fc); color: white; margin-top: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; width: auto; margin-left: 4px; }
        .btn-edit { background: #eab308; color: #000; }
        .btn-danger { background: #ef4444; color: #fff; }
        .section-title { font-size: 0.95rem; color: #f1f5f9; margin: 24px 0 12px; border-top: 1px solid #334155; padding-top: 16px; font-weight: 600; }
        
        /* Item Management Lists */
        .item-row { background: #090d16; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-title { font-weight: 600; font-size: 0.9rem; color: #f8fafc; }
        .item-sub { font-size: 0.75rem; color: #64748b; }
        .item-actions { display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="admin-card">
    <div id="loginSection" style="text-align: center;">
        <h2>🔒 Portal Authentication</h2>
        <div class="input-group">
            <input type="password" id="passInput" placeholder="Enter security passkey...">
        </div>
        <button class="btn btn-primary" onclick="checkAuth()">Authenticate</button>
    </div>

    <div id="dashSection" style="display: none;">
        <h2>⚡ Control Center</h2>
        
        <!-- Add/Edit Link Section -->
        <div class="section-title">Manage Connect Buttons</div>
        <input type="hidden" id="editLinkId" value="">
        <div class="input-group">
            <label>Button Label</label>
            <input type="text" id="linkTitle" placeholder="e.g. GitHub Repository">
        </div>
        <div class="input-group">
            <label>Target URL</label>
            <input type="url" id="linkUrl" placeholder="https://...">
        </div>
        <button class="btn btn-primary" id="saveLinkBtn" onclick="saveLink()">Publish Button</button>
        <button class="btn btn-sm" id="cancelEditBtn" style="display:none; margin-top:8px; background:#64748b; color:#fff;" onclick="resetLinkForm()">Cancel Edit</button>

        <div id="linksList" style="margin-top: 15px;"></div>

        <!-- Add/Manage Photo Section -->
        <div class="section-title">Manage Photos & Posts</div>
        <div class="input-group">
            <label>Select Image File</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>
        <div class="input-group">
            <label>Caption Text</label>
            <input type="text" id="photoCaption" placeholder="Optional description...">
        </div>
        <button class="btn btn-purple" onclick="uploadPhoto()">Publish Photo</button>

        <div id="photosList" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    const AUTH_KEY = "Dracula";

    function checkAuth() {
        if (document.getElementById("passInput").value === AUTH_KEY) {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("dashSection").style.display = "block";
            loadAdminData();
        } else {
            alert("Access Denied");
        }
    }

    function loadAdminData() {
        renderAdminLinks();
        renderAdminPhotos();
    }

    // --- LINK MANAGEMENT (CREATE, EDIT, DELETE) ---
    function saveLink() {
        const id = document.getElementById("editLinkId").value;
        const title = document.getElementById("linkTitle").value.trim();
        const url = document.getElementById("linkUrl").value.trim();
        if (!title || !url) return alert("Fill in title and URL");

        let links = JSON.parse(localStorage.getItem("ezra_links") || "[]");

        if (id) {
            // Edit existing
            links = links.map(item => item.id == id ? { id: Number(id), title, url } : item);
        } else {
            // Add new
            links.push({ id: Date.now(), title, url });
        }

        localStorage.setItem("ezra_links", JSON.stringify(links));
        resetLinkForm();
        renderAdminLinks();
    }

    function editLink(id) {
        const links = JSON.parse(localStorage.getItem("ezra_links") || "[]");
        const item = links.find(l => l.id == id);
        if (!item) return;

        document.getElementById("editLinkId").value = item.id;
        document.getElementById("linkTitle").value = item.title;
        document.getElementById("linkUrl").value = item.url;

        document.getElementById("saveLinkBtn").innerText = "Update Button";
        document.getElementById("cancelEditBtn").style.display = "block";
    }

    function resetLinkForm() {
        document.getElementById("editLinkId").value = "";
        document.getElementById("linkTitle").value = "";
        document.getElementById("linkUrl").value = "";
        document.getElementById("saveLinkBtn").innerText = "Publish Button";
        document.getElementById("cancelEditBtn").style.display = "none";
    }

    function deleteLink(id) {
        if (!confirm("Delete this button?")) return;
        let links = JSON.parse(localStorage.getItem("ezra_links") || "[]");
        links = links.filter(l => l.id != id);
        localStorage.setItem("ezra_links", JSON.stringify(links));
        renderAdminLinks();
    }

    function renderAdminLinks() {
        const container = document.getElementById("linksList");
        const links = JSON.parse(localStorage.getItem("ezra_links") || "[]");

        if (links.length === 0) {
            container.innerHTML = '<div style="color:#64748b; font-size:0.8rem; text-align:center;">No links created yet.</div>';
            return;
        }

        container.innerHTML = links.map(item => `
            <div class="item-row">
                <div class="item-info">
                    <div class="item-title">${item.title}</div>
                    <div class="item-sub">${item.url}</div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-sm btn-edit" onclick="editLink(${item.id})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteLink(${item.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    // --- PHOTO MANAGEMENT (CREATE, EDIT CAPTION, DELETE) ---
    function uploadPhoto() {
        const fileInput = document.getElementById("photoInput");
        const caption = document.getElementById("photoCaption").value.trim();
        if (!fileInput.files || !fileInput.files[0]) return alert("Select an image file");

        const reader = new FileReader();
        reader.onload = function(e) {
            const gallery = JSON.parse(localStorage.getItem("ezra_gallery") || "[]");
            gallery.unshift({ id: Date.now(), image: e.target.result, caption });
            localStorage.setItem("ezra_gallery", JSON.stringify(gallery));

            fileInput.value = "";
            document.getElementById("photoCaption").value = "";
            renderAdminPhotos();
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    function editCaption(id) {
        const gallery = JSON.parse(localStorage.getItem("ezra_gallery") || "[]");
        const item = gallery.find(p => p.id == id);
        if (!item) return;

        const newCaption = prompt("Edit photo caption:", item.caption || "");
        if (newCaption !== null) {
            item.caption = newCaption.trim();
            localStorage.setItem("ezra_gallery", JSON.stringify(gallery));
            renderAdminPhotos();
        }
    }

    function deletePhoto(id) {
        if (!confirm("Delete this photo?")) return;
        let gallery = JSON.parse(localStorage.getItem("ezra_gallery") || "[]");
        gallery = gallery.filter(p => p.id != id);
        localStorage.setItem("ezra_gallery", JSON.stringify(gallery));
        renderAdminPhotos();
    }

    function renderAdminPhotos() {
        const container = document.getElementById("photosList");
        const gallery = JSON.parse(localStorage.getItem("ezra_gallery") || "[]");

        if (gallery.length === 0) {
            container.innerHTML = '<div style="color:#64748b; font-size:0.8rem; text-align:center;">No photos uploaded yet.</div>';
            return;
        }

        container.innerHTML = gallery.map(item => `
            <div class="item-row">
                <div class="item-info" style="display:flex; align-items:center; gap:10px;">
                    <img src="${item.image}" style="width:36px; height:36px; object-fit:cover; border-radius:6px;">
                    <div>
                        <div class="item-title">${item.caption || "Untitled Photo"}</div>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-sm btn-edit" onclick="editCaption(${item.id})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deletePhoto(${item.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
